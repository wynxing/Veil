[package]
name = "veil-driver-helper"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "veil_driver_helper"
path = "src/main.rs"
test = false
bench = false

[dependencies]
veil-engine = { path = "../veil-engine" }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
winresource = "0.1"
