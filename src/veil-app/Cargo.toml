[package]
name = "veil-app"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "veil_app"
path = "src/main.rs"
test = false
bench = false

[dependencies]
veil-engine = { path = "../veil-engine" }
eframe = { version = "0.31", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
egui = "0.31"
raw-window-handle = "0.6"
tray-icon = "0.19"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "0.1"
